<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./CSS/LibrarianPageStyling.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Figtree:ital,wght@0,300..900;1,300..900&family=Pacifico&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Figtree:ital,wght@0,300..900;1,300..900&family=Kosugi+Maru&family=Pacifico&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

</head>
<body>
    <!-- OUTSIDE ELEMENTS - site logo -->
    <img id="imgClive" src="./CSS/Assets/Clive Sideways.png" alt="Site Logo">

    <main>
        <!-- TOP SECTION - welcome text and librarian options -->
        <section id="secLibrarianPage">
            <section id="secBorderTop">
                <div id="divBodyTop">
                    <section id="secTextTop">
                        <article id="artWelc">Welcome Librarian!</article>
                        <article id="artName"></article>
                        <article id="artID"></article>
                    </section>

                    <section id="secButtonsTop">
                        <button id="btnManageBooks">Manage Books</button>
                        <button id="btnShowBookHistory">Show Book History</button>
                        <button id="btnLogOutLibrarian">Log Out</button>
                    </section>
                </div>
            </section>
        </section>

        <!-- BOTTOM SECTION - holds both the manage books list and user book activity history list -->
        <section id="secBot" style="display: none;">
            <section id="secBorderBot">
                <!-- MANAGE BOOK DIV - contains the elements of the "Manage Books" page -->
                <div id="secBooksList" style="display: none;">
                    <!-- HEADER -->
                    <header class="headerWelc">Cloudary Collection</header>

                    <!-- BUTTON OPTIONS -->
                    <section class="secButtons">
                        <button id="btnSearchBookId">Search by ID</button>
                        <button id="btnSearchBookTitle">Search by Title</button>
                        <button id="btnSearchBookAuthor">Search by Author</button>
                        <button id="btnSearchBookCategory">Search by Category</button>
                        <button id="btnSearchBookAvailability">Search by Availability</button>
                    </section>

                    <!-- SEARCH INPUTS/FILTERS -->
                    <section class="secSearchInputs" style="display: none;">
                        <input id="txtSearchBookId" type="number" placeholder="Search by ID" style="display: none;">
                        <input id="txtSearchBookTitle" type="text" placeholder="Search by Title" style="display: none;">
                        <input id="txtSearchBookAuthor" type="text" placeholder="Search by Author" style="display: none;">
                        <input id="txtSearchBookCategory" type="text" placeholder="Search by Category" style="display: none;">
                        <select id="selBookAvailability" style="display: none;">
                            <option value="Available"> Available </option>
                            <option value="Borrowed"> Borrowed </option>
                        </select>
                    </section>

                    <!-- BOOK ADDING SECTION - facilitates the book adding feature of the site -->
                    <section id="secAddForm">
                        <button id="btnAddBook">Add A Book To Cloudary</button>
                        <section id="secNewBook" style="display: none;">
                            <input type="text" id="txtTitle" placeholder="Title">
                            <input type="text" id="txtAuthor" placeholder="Author">
                            <input type="text" id="txtCategory" placeholder="Category">
                        </section>
                        <img id="imgSeparator" src="./CSS/Assets/Separator.png" style="display: none;">
                        <article id="artButtons" style="display: none;">
                            <button id="btnSubmitBook">Add Book To Cloudary!</button>
                            <button id="btnCancelBook">Cancel</button>
                        </article>
                    </section>

                    <!-- MAIN TABLE - for the manage view -->
                    <section class="secTableHolder">
                        <div class="divTableContainer">
                            <table class="tblData">
                                <thead class="tblHead">
                                    <tr>
                                        <th>ID</th>
                                        <th>TITLE</th>
                                        <th>AUTHOR</th>
                                        <th>CATEGORY</th>
                                        <th>AVAILABILITY</th>
                                        <th>ACTION</th>
                                    </tr>
                                </thead>
                                <tbody id="tblBooks">
                                    <tr>
                                        <td>1001</td>
                                        <td>
                                            <span>Eligsir's Adventures Vol.1</span>
                                            <input type="text" style="display: none;">
                                        </td>
                                        <td>
                                            <span>Rosales, Luiz Gabriel</span>
                                            <input type="text" style="display: none;">
                                        </td>
                                        <td>
                                            <span>Fantasy</span>
                                            <input type="text" style="display: none;">
                                        </td>
                                        <td>Available</td>
                                        <td>
                                            <button>Edit Book</button>
                                            <button style="display: none;">Save Book</button>
                                            <button>Delete Book</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>



                <!-- ACTIVITY HISTORY DIV - contains the elements of the "Show Book History" page -->
                <div id="secBookHistory" style="display: none;">
                    <!-- HEADER -->
                    <header class="headerWelc">Cloudary Book History</header>

                    <!-- BUTTON OPTIONS -->
                    <section class="secButtons">
                        <button id="btnSearchBookHistoryId">Search by Book ID</button>
                        <button id="btnSearchStudentId">Search by Student ID</button>
                        <button id="btnSearchBookHistoryActivity">Search by Activity</button>
                        <button id="btnClearBookHistory">Clear Book History</button>
                    </section>

                    <!-- SEARCH INPUTS/FILTERS -->
                    <section class="secSearchInputs" style="display: none;">
                        <input id="txtSearchBookHistoryId" type="number" placeholder="Search by Book ID"  style="display: none;">
                        <input id="txtSearchStudentId" type="number" placeholder="Search by Student ID" style="display: none;">
                        <select id="selBookActivity" style="display: none;">
                            <option value="Borrowed"> Borrowed </option>
                            <option value="Returned"> Returned </option>
                        </select>
                    </section>

                    <!-- MAIN TABLE - for the return activity history view -->
                    <section class="secTableHolder">
                        <div class="divTableContainer">
                            <table class="tblData">
                                <thead class="tblHead">
                                    <tr>
                                        <th>BOOK ID</th>
                                        <th>BOOK TITLE</th>
                                        <th>BOOK AUTHOR</th>
                                        <th>BOOK CATEGORY</th>
                                        <th>STUDENT ID</th>
                                        <th>STUDENT NAME</th>
                                        <th>ACTIVITY</th>
                                        <th>ACTION</th>
                                    </tr>
                                </thead>
                                <tbody id="tblBooksHistory">
                                    
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </section>
        </section>
    </main>
    
    <div id="popupContainer">
	</div>
    
	<script src="/Starting Page/JS Assets/jquery-3.7.1.min.js"></script>
	<script src="/Starting Page/JS Assets/Validation.js"></script>
    <script src="/Starting Page/JS Assets/User.js"></script>
	<script src="/Starting Page/JS Assets/Book.js"></script>
    <script src="/Starting Page/JS Assets/Activity.js"></script>
	<script src="./JS/librarianScript.js"></script>
	<script src="./JS/LibrarianAnimation.js"></script>

</body>
</html>
